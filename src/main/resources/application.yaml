server:
  port: 8080

spring:
  application:
    name: SpringAI

  threads:
    virtual:
      enabled: true           # Day74: 请求处理层虚拟线程（50 并发不占死平台线程）

  servlet:
    multipart:
      max-file-size: 20MB              # 允许上传较大图片
      max-request-size: 200MB         # 整个请求上限（批量上传必须放大）

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_db
    username: postgres
    password: xia0713
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20   # Day74: 默认 10 是 50 并发的隐形杀手（部署前算乘法：20×副本数≤PG上限）
      connection-timeout: 3000 # 3 秒拿不到连接快速失败，别挂 30s

  ai:
    # 向量存储配置
    vectorstore:
      pgvector:
        table-name: vector_store  # 表名,默认表名 vector_store
        dimensions: 3072          # ⚠️ 必须和你的 Embedding 模型维度一致,向量维度（不填则自动从 EmbeddingModel 获取）
        index-type: none           # 3072 维超过 pgvector HNSW/IVFFlat 的 2000 维上限，暂不建索引
        initialize-schema: true     # 【关键！】启动时自动建表建索引
        distance-type: COSINE_DISTANCE  # 距离度量，默认余弦距离
          # schema-name: public       # 默认 public
        max-document-batch-size: 10000  # 单批次最大文档数

    openai:
      # 第三方中转平台基础地址，只写到域名/端口，Spring AI 自动拼接 /v1/chat/completions
      base-url: https://ai-gateway.ztn.cn
      # 中转平台分配的 API 密钥，严禁写在代码中
      api-key: sk-RtUONsbppcygBmXyRI56E1evZVh9sqhAwYtphlK0Jxjey2tv
      chat:
        options:
          # 中转平台对应的模型名称，和你之前 curl 用的保持一致
          model: qwen3.8-27b
          # 默认温度参数，可在代码中动态覆盖。用于控制输出随机性,取值 0-1。值越低输出越稳定、确定性越强；值越高越发散、创造性越强。代码生成、信息提取类场景建议 0.1-0.3；创作类场景建议 0.7-0.9。
          temperature: 0.1
          # 默认最大输出 Token
          max-tokens: 2000
          # 默认关闭流式输出，一次性返回结果
          stream: true
          # 关键：关闭 qwen3 的思考模式，直接输出 content
          extra-body-parameters:
            enable_thinking: false

      embedding:
#        options:
#          model: gemini-embedding-001
        enabled: false  # 手动 EmbeddingConfig 提供 bean，禁用自动配置避免冲突

#        path: /chat/completions  # 自定义接口路径.确认中转平台的接口路径是否符合 OpenAI 规范，极少数中转不带 /v1，需要额外配置
# 自定义配置（可选）
app:
  chat:
    # 系统提示词
    system-prompt: 你是一个专业的Java开发助手，回答简洁准确，多用代码示例
  # 多模型网关配置（MultiModelConfig 使用）
  gateway:
    base-url: https://ai-gateway.ztn.cn
    api-key: sk-RtUONsbppcygBmXyRI56E1evZVh9sqhAwYtphlK0Jxjey2tv
  # Embedding 专属网关（ztn 不支持 embedding，走 micuapi.ai）
  embedding:
    base-url: https://www.micuapi.ai
    api-key: sk-LQKMaAjMTlyRxutKOHMC7OF0e3CoXfog46V1hxmRYq7z1xWw
  # 模拟 ERP 接口（Day53 对接现有业务 API 演示）
  erp:
    base-url: http://localhost:8080
    api-key: demo-key-123
  # AI 能力网关（Day73）：业务系统接入凭证
  ai-gateway:
    api-key: demo-ai-key-456
  # 提示词灰度（Day76）：比例运行时可调（POST /api/prompt-gray/percent?p=0 即秒级回滚）
  prompt-gray:
    percent: 30            # 30% 用户进 v2（hash(userId)%100 < 30）
    default-version: v1

# ========== 日志配置 ==========
logging:
  pattern:
    # Day79: traceId/spanId 自动进每行日志（MDC），grep 一个 ID 还原全链路
    level: "%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] %m%n"
  level:
    org.springframework.ai: DEBUG
    com.example.aiscaffold: DEBUG
    # 开启 HTTP 请求日志，排查 404 问题
    org.apache.hc.client5: DEBUG
    reactor.netty.http.client: DEBUG

# 顶层配置（与 spring: 平级）
resilience4j:
  circuitbreaker:
    instances:
      llm:                                    # 熔断实例名，与注解 name 对应
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10               # 统计最近 10 次调用
        minimum-number-of-calls: 5            # 至少 5 次才判定（防单次抖动误熔断）
        failure-rate-threshold: 50            # 失败率 ≥50% → OPEN
        wait-duration-in-open-state: 10s      # OPEN 持续 10s → HALF_OPEN
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      llm:
        limit-for-period: 20                  # 每周期最多 20 次
        limit-refresh-period: 1s              # 周期 1 秒
        timeout-duration: 500ms               # 拿不到许可快速失败（交互场景）

# ========== 可观测性：探针（Day75）+ 监控端点（Day78）+ 链路追踪（Day79）==========
management:
  tracing:
    sampling:
      probability: 1.0    # Demo 全采样；生产 0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus    # Day78: 监控抓取端点
  endpoint:
    health:
      probes:
        enabled: true     # 开启 /actuator/health/liveness 和 /actuator/health/readiness